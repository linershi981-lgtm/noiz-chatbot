/* ─── State ─── */
var state = {
  open:false, lang:'zh', messages:[], isTyping:false,
  unread:1, toastVisible:false, history:[], langMenuOpen:false,
  pos:null,
  survey:{q1:0,q2a:0,q2b:0,q2c:0,q2d:0,q2e:'',q3:'',q4:''}
};

function ts(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/\n/g,'<br>').replace(/`([^`]+)`/g,'<code class="ic">$1</code>'); }
function L(k){ return I18N[state.lang][k]||''; }
function botIcon(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>'; }

/* ─── API ─── */
async function callAPI(userText){
  state.history.push({role:'user',content:userText});
  // ⚠️ 上线前改这里：换成后端接口地址，删掉 x-api-key 行
  var resp = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYSTEM_PROMPTS[state.lang],messages:state.history})
  });
  var data = await resp.json();
  var raw = (data.content||[]).map(function(b){return b.type==='text'?b.text:'';}).join('');
  var parsed;
  try{parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());}
  catch(e){parsed={resolved:false,reply:raw||L('netErr')};}
  state.history.push({role:'assistant',content:raw});
  return parsed;
}

/* ─── Survey ─── */
function buildSurveyHtml(){
  var sv=state.survey, isLow=sv.q1>0&&sv.q1<=3, isHigh=sv.q1>=4;
  // Q1 stars
  var s1=''; for(var i=1;i<=5;i++) s1+='<button class="star'+(i<=sv.q1?' on':'')+'" data-q1="'+i+'">★</button>';
  // Q2 sub-ratings
  var q2keys=['q2a','q2b','q2c','q2d'], q2labels=['surveyQ2a','surveyQ2b','surveyQ2c','surveyQ2d'];
  var s2='';
  for(var j=0;j<4;j++){
    var rs=''; for(var k=1;k<=5;k++) rs+='<button class="rstar'+(k<=(sv[q2keys[j]]||0)?' on':'')+'" data-q2k="'+q2keys[j]+'" data-q2v="'+k+'">★</button>';
    s2+='<div class="survey-row"><div class="survey-label">'+esc(L(q2labels[j]))+'</div><div class="rating-row">'+rs+'</div></div>';
  }
  // Q3 options
  var q3opts=['surveyQ3a','surveyQ3b','surveyQ3c','surveyQ3d'];
  var s3='<div class="qchips" style="flex-direction:column;align-items:flex-start;margin-top:4px">';
  for(var m=0;m<4;m++){
    var act=sv.q3===q3opts[m];
    s3+='<button class="qchip" style="'+(act?'background:#111;color:#fff;border-color:#111;':'')+'" data-q3="'+q3opts[m]+'">'+esc(L(q3opts[m]))+'</button>';
  }
  s3+='</div>';
  // Q4
  var q4label = isLow?L('surveyQ4low'):(isHigh?L('surveyQ4high'):'');
  var s4 = q4label?'<div class="survey-row"><div class="survey-label">'+esc(q4label)+'</div><textarea class="survey-textarea" id="sq4" rows="2">'+esc(sv.q4||'')+'</textarea></div>':'';

  return '<div class="survey-card" id="sv-card">'
    +'<h4>'+esc(L('surveyTitle'))+'</h4>'
    +'<div class="survey-row"><div class="survey-label">'+esc(L('surveyQ1'))+'</div><div class="stars">'+s1+'</div></div>'
    +'<div class="survey-row"><div class="survey-label">'+esc(L('surveyQ2'))+'</div>'+s2+'</div>'
    +'<div class="survey-label">'+esc(L('surveyQ2e'))+'</div>'
    +'<textarea class="survey-textarea" id="sq2e" rows="2">'+esc(sv.q2e||'')+'</textarea>'
    +'<div class="survey-row"><div class="survey-label">'+esc(L('surveyQ3'))+'</div>'+s3+'</div>'
    +s4
    +'<button class="survey-submit" id="sv-submit">'+esc(L('surveySubmit'))+'</button>'
    +'</div>';
}

function bindSurveyEvents(){
  document.querySelectorAll('.star').forEach(function(b){
    b.onclick=function(){state.survey.q1=parseInt(b.getAttribute('data-q1'));patchSurvey();};
  });
  document.querySelectorAll('.rstar').forEach(function(b){
    b.onclick=function(){state.survey[b.getAttribute('data-q2k')]=parseInt(b.getAttribute('data-q2v'));patchSurvey();};
  });
  document.querySelectorAll('[data-q3]').forEach(function(b){
    b.onclick=function(){state.survey.q3=b.getAttribute('data-q3');patchSurvey();};
  });
  var e=document.getElementById('sq2e'); if(e) e.oninput=function(){state.survey.q2e=this.value;};
  var f=document.getElementById('sq4'); if(f) f.oninput=function(){state.survey.q4=this.value;};
  var g=document.getElementById('sv-submit'); if(g) g.onclick=submitSurvey;
}

function patchSurvey(){
  var card=document.getElementById('sv-card');
  if(!card) return;
  var tmp=document.createElement('div');
  tmp.innerHTML=buildSurveyHtml();
  card.parentNode.replaceChild(tmp.firstChild, card);
  bindSurveyEvents();
  scrollBottom();
}

function submitSurvey(){
  for(var i=state.messages.length-1;i>=0;i--){
    if(state.messages[i].role==='survey'){state.messages.splice(i,1);break;}
  }
  state.survey={q1:0,q2a:0,q2b:0,q2c:0,q2d:0,q2e:'',q3:'',q4:''};
  state.messages.push({role:'bot',content:L('surveyThanks'),time:ts()});
  render(); scrollBottom();
}

/* ─── Render helpers ─── */

  var safeQ=(userQ||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  var subj=encodeURIComponent('[Noiz Support] '+((userQ||'').substring(0,60)));

    +'<a href="https://noiz.ai/contact" target="_blank" class="fbb lt"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>'+esc(L('fbFeedback'))+'</a>'
    +'<p class="fb-hint">'+esc(L('fbHint'))+'</p>'

function renderMsg(m){
  if(m.role==='fallback') return renderFallback(m.userQ);
  if(m.role==='survey') return '<div class="mr b" style="align-items:flex-start"><div class="mi b">'+botIcon()+'</div>'+buildSurveyHtml()+'</div><div class="mt">'+m.time+'</div>';
  var isUser=m.role==='user';
  var bubbleContent='<div style="font-size:13px;line-height:1.55;color:'+(isUser?'#fff':'#111')+'">'+fmt(m.content)+'</div>';
  if(m.chips){
    // Split last chip (survey) from regular chips
    var regularChips=m.chips.slice(0,-1);
    var surveyChip=m.chips[m.chips.length-1];
    var gridHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px">';
    for(var i=0;i<regularChips.length;i++){
      gridHtml+='<button class="qchip" data-chip="'+esc(regularChips[i])+'" style="border-radius:8px;text-align:left;white-space:normal;line-height:1.3">'+esc(regularChips[i])+'</button>';
    }
    gridHtml+='</div>';
    // Survey chip full width below
    var surveyHtml='<button class="qchip survey-chip" data-chip="'+esc(surveyChip)+'" style="width:100%;margin-top:5px;border-radius:8px;text-align:center;justify-content:center">'+esc(surveyChip)+'</button>';
    var faqLabel='<div style="font-size:11px;color:#aaa;margin-top:10px;margin-bottom:4px;font-weight:500;letter-spacing:0.03em">'+esc(L('faqLabel'))+'</div>';
    bubbleContent+= faqLabel + gridHtml + surveyHtml;
  }
  var bubble='<div class="mb" style="max-width:268px">'+bubbleContent+'</div>';
  var inner='<div class="mr '+(isUser?'u':'b')+'">'
    +(!isUser?'<div class="mi b">'+botIcon()+'</div>':'')
    +'<div>'+bubble+'</div>'
    +(isUser?'<div class="mi u2">You</div>':'')
    +'</div>';
  return inner+'<div class="mt">'+m.time+'</div>';
}

function scrollBottom(){ var el=document.getElementById('cwm'); if(el) el.scrollTop=el.scrollHeight; }

/* ─── Main render ─── */
function render(){
  var old=document.querySelector('.chat-window'); if(old) old.remove();
  var oldW=document.querySelector('.cw-wrap'); if(oldW) oldW.remove();

  if(state.open){
    var win=document.createElement('div');
    win.className='chat-window';
    var langMenu='';
    if(state.langMenuOpen){
      langMenu='<div class="lang-menu">';
      var langs=['zh','en','ja'];
      var labels=L('langLabels');
      for(var li=0;li<3;li++) langMenu+='<button class="lang-opt'+(state.lang===langs[li]?' active':'')+'" data-lang="'+langs[li]+'">'+labels[li]+'</button>';
      langMenu+='</div>';
    }
    win.innerHTML=
      '<div class="cw-header">'
      +'<div class="cw-av">'+botIcon()+'</div>'
      +'<div class="cw-hi"><h3>'+esc(L('title'))+'</h3><p>'+esc(L('online'))+'</p></div>'
      +'<div class="cw-hbtns">'
      +'<div style="position:relative"><button class="cw-langbtn" id="langbtn">🌐</button>'+langMenu+'</div>'
      +'<button class="cw-x" id="cwx">−</button>'
      +'</div></div>'
      +'<div class="cw-msgs" id="cwm">'
      +state.messages.map(renderMsg).join('')
      +(state.isTyping?'<div class="typ-r"><div class="mi b">'+botIcon()+'</div><div class="typ-b"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>':'')
      +'</div>'
      +'<div class="cw-inp">'
      +'<div class="cw-toast'+(state.toastVisible?' show':'')+'" id="cwt">'+esc(L('copied'))+'</div>'
      +'<textarea class="cw-ta" id="cwta" placeholder="'+esc(L('placeholder'))+'" rows="1"></textarea>'
      +'<button class="cw-sb" id="cwsb"'+(state.isTyping?' disabled':'')+'><svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>'
      +'</div>';
    document.body.appendChild(win);
    if(state.pos){
      var bL=state.pos.left,bT=state.pos.top,bS=52,wW=window.innerWidth,wH=window.innerHeight,cwW=360,cwH=540,gap=12;
      var cl=bL+bS-cwW; if(cl<8)cl=8; if(cl+cwW>wW-8)cl=wW-cwW-8;
      var ct=bT-cwH-gap; if(ct<8)ct=bT+bS+gap; if(ct+cwH>wH-8)ct=wH-cwH-8;
      win.style.left=cl+'px'; win.style.top=ct+'px'; win.style.right='auto'; win.style.bottom='auto';
    }
    scrollBottom();

    document.getElementById('cwx').onclick=function(){state.open=false;render();};

    // lang toggle
    document.getElementById('langbtn').onclick=function(e){
      e.stopPropagation();
      state.langMenuOpen=!state.langMenuOpen;
      render();
    };
    win.querySelectorAll('[data-lang]').forEach(function(btn){
      btn.onclick=function(e){
        e.stopPropagation();
        var nl=btn.getAttribute('data-lang');
        if(nl!==state.lang){state.lang=nl;state.history=[];state.messages=[];state.langMenuOpen=false;openChat();}
        else{state.langMenuOpen=false;render();}
      };
    });
    document.addEventListener('click',function cl(){state.langMenuOpen=false;render();document.removeEventListener('click',cl);});

    // textarea
    var ta=document.getElementById('cwta');
    ta.focus();
    ta.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});
    ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
    document.getElementById('cwsb').onclick=doSend;

    // copy buttons
    win.querySelectorAll('.cq-btn').forEach(function(btn){
      btn.onclick=function(){
        var txt=btn.getAttribute('data-q')||'';
        try{navigator.clipboard.writeText(txt);}catch(e){var el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);}
        state.toastVisible=true;render();setTimeout(function(){state.toastVisible=false;render();},2000);
      };
    });

    // quick chips
    win.querySelectorAll('[data-chip]').forEach(function(btn){
      btn.onclick=function(){
        var chip=btn.getAttribute('data-chip');
        var chips=L('chips');
        if(chip===chips[chips.length-1]){ openSurvey(); }
        else{ doSend(chip); }
      };
    });

    // survey events
    bindSurveyEvents();
  }

  // toggle button
  var wrap=document.createElement('div');
  wrap.className='cw-wrap';
  wrap.innerHTML='<button class="cw-tog" id="cwtog">'
    +(state.open?'<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>')
    +'</button>'
    +(!state.open&&state.unread>0?'<div class="cw-badge">'+state.unread+'</div>':'');
  document.body.appendChild(wrap);

  // Restore saved drag position
  if(state.pos){
    wrap.style.left=state.pos.left+'px'; wrap.style.top=state.pos.top+'px';
    wrap.style.right='auto'; wrap.style.bottom='auto';
  }

  // Drag logic: track pointer movement, distinguish drag from click
  var tog=document.getElementById('cwtog');
  var dragging=false, moved=false, startX, startY, startLeft, startTop;

  function startDrag(cx,cy){
    dragging=true; moved=false;
    var r=wrap.getBoundingClientRect();
    startX=cx; startY=cy; startLeft=r.left; startTop=r.top;
    wrap.style.left=startLeft+'px'; wrap.style.top=startTop+'px';
    wrap.style.right='auto'; wrap.style.bottom='auto';
  }
  function moveDrag(cx,cy){
    if(!dragging)return;
    var dx=cx-startX, dy=cy-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    wrap.style.left=Math.max(0,Math.min(window.innerWidth-56,startLeft+dx))+'px';
    wrap.style.top=Math.max(0,Math.min(window.innerHeight-56,startTop+dy))+'px';
  }
  function posChatWin(){
    var cw=document.querySelector('.chat-window');
    if(!cw||!state.pos)return;
    var bL=state.pos.left,bT=state.pos.top,bS=52;
    var wW=window.innerWidth,wH=window.innerHeight;
    var cwW=360,cwH=540,gap=12;
    var cl=bL+bS-cwW; if(cl<8)cl=8; if(cl+cwW>wW-8)cl=wW-cwW-8;
    var ct=bT-cwH-gap; if(ct<8)ct=bT+bS+gap; if(ct+cwH>wH-8)ct=wH-cwH-8;
    cw.style.left=cl+'px'; cw.style.top=ct+'px';
    cw.style.right='auto'; cw.style.bottom='auto';
  }
  function endDrag(){
    if(!dragging)return; dragging=false;
    var r=wrap.getBoundingClientRect();
    state.pos={left:r.left,top:r.top};
    posChatWin();
  }

  wrap.addEventListener('mousedown',function(e){startDrag(e.clientX,e.clientY);e.preventDefault();});
  wrap.addEventListener('touchstart',function(e){startDrag(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('mousemove',function(e){moveDrag(e.clientX,e.clientY);});
  document.addEventListener('touchmove',function(e){moveDrag(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('mouseup',endDrag);
  document.addEventListener('touchend',endDrag);

  tog.onclick=function(){ if(moved){moved=false;return;} state.open=!state.open;state.unread=0; if(state.open&&state.messages.length===0)openChat(); render(); };
}

function openChat(){
  state.messages=[{role:'bot',content:L('welcome'),chips:L('chips'),time:ts()}];
  render(); scrollBottom();
}

function openSurvey(){
  state.survey={q1:0,q2a:0,q2b:0,q2c:0,q2d:0,q2e:'',q3:'',q4:''};
  state.messages.push({role:'survey',time:ts()});
  render(); scrollBottom();
}

async function doSend(prefill){
  var ta=document.getElementById('cwta');
  var text=(typeof prefill==='string'?prefill:(ta?ta.value:'')).trim();
  if(!text||state.isTyping)return;
  if(ta){ta.value='';ta.style.height='auto';}
  state.messages.push({role:'user',content:text,time:ts()});
  state.isTyping=true;
  render();scrollBottom();
  try{
    var result=await callAPI(text);
    state.isTyping=false;
    state.messages.push({role:'bot',content:result.reply,time:ts()});
    if(!result.resolved) state.messages.push({role:'fallback',userQ:text,time:ts()});
  }catch(err){
    state.isTyping=false;
    state.messages.push({role:'bot',content:L('netErr'),time:ts()});
  }
  render();scrollBottom();
}

window.sendToBot=function(text){
  if(!state.open){state.open=true;state.unread=0;if(state.messages.length===0)openChat();render();setTimeout(function(){doSend(text);},300);}
  else{doSend(text);}
};

render();
})();
</script>
